# Render the Quarto website and publish it to GitHub Pages.
# Runs every time you push to the main branch (and can be started by hand
# from the Actions tab with "Run workflow").
#
# One-off setup on GitHub: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".

name: Publish website

on:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}   # avoids GitHub API rate limits when installing R packages from GitHub
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # fast pre-built Linux binaries

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::pacman
            any::tidyverse
            any::metafor
            any::clubSandwich
            any::ape
            any::rotl
            any::corrplot
            any::patchwork
            any::readxl
            any::here
            any::sp
            any::MASS
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            github::daniel1noble/orchaRd
            github::daniel1noble/metaAidR

      - name: Render the website
        run: quarto render

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
